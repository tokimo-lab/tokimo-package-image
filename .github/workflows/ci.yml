name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LIBVIPS_REPO: tokimo-lab/tokimo-package-libvips
  LIBVIPS_RELEASE_TAG: v8.18.2-tokimo.3

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  linux:
    name: linux (build + clippy + test)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download libvips install (linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libvips"
          gh release download "$LIBVIPS_RELEASE_TAG" \
            -R "$LIBVIPS_REPO" \
            -p install-linux.tar.zst \
            -O "$RUNNER_TEMP/libvips/install-linux.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/libvips/install-linux.tar.zst" -C "$RUNNER_TEMP/libvips"
          # Create the unversioned symlink expected by `-lgobject-2.0`.
          ln -sf libgobject-2.0.so.0 "$RUNNER_TEMP/libvips/lib/libgobject-2.0.so"
          ls -la "$RUNNER_TEMP/libvips/lib"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/libvips
          LD_LIBRARY_PATH: ${{ runner.temp }}/libvips/lib
        run: cargo clippy --lib --bins --tests -- -D warnings

      - name: cargo build
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/libvips
          LD_LIBRARY_PATH: ${{ runner.temp }}/libvips/lib
        run: cargo build --lib --bins --tests

      - name: cargo test
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/libvips
          LD_LIBRARY_PATH: ${{ runner.temp }}/libvips/lib
        run: cargo test --lib --bins --tests

  macos:
    name: macos (build + clippy + test)
    runs-on: macos-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies (Homebrew)
        # macOS dylibs in install/ have absolute LC_LOAD_DYLIB paths into
        # /opt/homebrew/opt/<dep>/lib/. Without these brew packages, dyld
        # fails when loading any binary linking libvips.
        # `brew install vips` pulls in the libvips runtime closure (glib,
        # libpng, webp, libtiff, librsvg, orc, fftw, lcms2, libheif, ...).
        run: |
          brew update
          brew install pkg-config zstd vips

      - name: Download libvips install (macos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libvips"
          gh release download "$LIBVIPS_RELEASE_TAG" \
            -R "$LIBVIPS_REPO" \
            -p install-macos-arm64.tar.zst \
            -O "$RUNNER_TEMP/libvips/install-macos-arm64.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/libvips/install-macos-arm64.tar.zst" -C "$RUNNER_TEMP/libvips"
          # Create the unversioned symlink expected by `-lgobject-2.0`.
          ln -sf libgobject-2.0.0.dylib "$RUNNER_TEMP/libvips/lib/libgobject-2.0.dylib"
          ls -la "$RUNNER_TEMP/libvips/lib"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/libvips
          DYLD_FALLBACK_LIBRARY_PATH: ${{ runner.temp }}/libvips/lib
        run: cargo clippy --lib --bins --tests -- -D warnings

      - name: cargo build
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/libvips
          DYLD_FALLBACK_LIBRARY_PATH: ${{ runner.temp }}/libvips/lib
        run: cargo build --lib --bins --tests

      - name: cargo test
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/libvips
          DYLD_FALLBACK_LIBRARY_PATH: ${{ runner.temp }}/libvips/lib
        run: cargo test --lib --bins --tests

  windows:
    name: windows (build + clippy + test)
    runs-on: windows-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Download libvips install (windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libvips"
          gh release download "$LIBVIPS_RELEASE_TAG" \
            -R "$LIBVIPS_REPO" \
            -p install-windows.tar.zst \
            -O "$RUNNER_TEMP/libvips/install-windows.tar.zst"
          cd "$RUNNER_TEMP/libvips"
          tar --force-local --use-compress-program=zstd -xf install-windows.tar.zst
          ls "$RUNNER_TEMP/libvips"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt

      - name: Install MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          static: 0

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy / build / test
        shell: pwsh
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}\libvips
        run: |
          $env:PATH = "${{ runner.temp }}\libvips\bin;" + $env:PATH
          cargo clippy --target x86_64-pc-windows-gnu --lib --bins --tests -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --target x86_64-pc-windows-gnu --lib --bins --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --target x86_64-pc-windows-gnu --lib --bins --tests
          exit $LASTEXITCODE
