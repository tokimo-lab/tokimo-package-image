name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TOKIMO_LIB_REPO: tokimo-lab/tokimo-lib
  TOKIMO_LIB_VERSION: v1.1.3

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  linux:
    name: linux (clippy + test)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Download tokimo-lib (linux-x86_64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tokimo-lib"
          gh release download "$TOKIMO_LIB_VERSION" \
            -R "$TOKIMO_LIB_REPO" \
            -p 'tokimo-lib-linux-x86_64.tar.zst' \
            -D "$RUNNER_TEMP/tokimo-lib"
          tar --zstd -xf "$RUNNER_TEMP/tokimo-lib/tokimo-lib-linux-x86_64.tar.zst" -C "$RUNNER_TEMP/tokimo-lib"
          ls -la "$RUNNER_TEMP/tokimo-lib/lib"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/tokimo-lib
          LD_LIBRARY_PATH: ${{ runner.temp }}/tokimo-lib/lib
        run: cargo clippy --lib --bins --tests -- -D warnings

      - name: cargo test
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/tokimo-lib
          LD_LIBRARY_PATH: ${{ runner.temp }}/tokimo-lib/lib
        run: cargo test --lib --bins --tests

  macos:
    name: macos (clippy + test)
    runs-on: macos-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Download tokimo-lib (macos-aarch64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tokimo-lib"
          gh release download "$TOKIMO_LIB_VERSION" \
            -R "$TOKIMO_LIB_REPO" \
            -p 'tokimo-lib-macos-aarch64.tar.zst' \
            -D "$RUNNER_TEMP/tokimo-lib"
          tar --zstd -xf "$RUNNER_TEMP/tokimo-lib/tokimo-lib-macos-aarch64.tar.zst" -C "$RUNNER_TEMP/tokimo-lib"
          ls -la "$RUNNER_TEMP/tokimo-lib/lib"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/tokimo-lib
          DYLD_FALLBACK_LIBRARY_PATH: ${{ runner.temp }}/tokimo-lib/lib
        run: cargo clippy --lib --bins --tests -- -D warnings

      - name: cargo test
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/tokimo-lib
          DYLD_FALLBACK_LIBRARY_PATH: ${{ runner.temp }}/tokimo-lib/lib
        run: cargo test --lib --bins --tests

  windows:
    name: windows (clippy + test)
    runs-on: windows-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Download tokimo-lib (windows-x86_64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tokimo-lib"
          gh release download "$TOKIMO_LIB_VERSION" \
            -R "$TOKIMO_LIB_REPO" \
            -p 'tokimo-lib-windows-x86_64.tar.zst' \
            -D "$RUNNER_TEMP/tokimo-lib"
          cd "$RUNNER_TEMP/tokimo-lib"
          tar --force-local --use-compress-program=zstd -xf tokimo-lib-windows-x86_64.tar.zst
          ls "$RUNNER_TEMP/tokimo-lib/lib"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        shell: bash
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/tokimo-lib
        run: |
          export PATH="${RUNNER_TEMP}/tokimo-lib/bin:$PATH"
          cargo clippy --lib --bins --tests -- -D warnings

      - name: cargo test
        shell: bash
        env:
          TOKIMO_DEP_LIBVIPS_DIR: ${{ runner.temp }}/tokimo-lib
        run: |
          export PATH="${RUNNER_TEMP}/tokimo-lib/bin:$PATH"
          cargo test --lib --bins --tests
