[package]
name = "tokimo-package-image"
version = "0.1.0"
edition = "2024"
description = "On-the-fly image resize, thumbnail generation, and caching"


[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
tokio = { version = "1", features = ["fs", "sync", "rt"] }
tracing = "0.1"
kamadak-exif = "0.5"
chrono = "0.4"
serde_json = "1"
async-trait = "0.1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.11"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_LibraryLoader", "Win32_Foundation"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "sync", "rt", "rt-multi-thread", "macros"] }
